name: Daily article

on:
  schedule:
    # Three articles a day. Times below are Pakistan Standard Time (UTC+5),
    # so each cron is the PKT time minus 5 hours.
    #
    # None of these sit on the hour, and that is deliberate: GitHub queues
    # every cron job firing at :00 together, so top-of-hour schedules are the
    # most delayed and the most likely to be dropped under load.
    # Each slot has two catch-up runs behind it. GitHub delays scheduled
    # workflows under load and sometimes drops them entirely, so a single cron
    # per slot is unreliable. The script publishes only when an article is
    # actually owed, so a catch-up that finds nothing missing just exits.
    - cron: "11 2 * * *"    # 07:11 PKT — morning
    - cron: "36 2 * * *"    # 07:36 PKT — morning catch-up
    - cron: "6 3 * * *"     # 08:06 PKT — morning catch-up

    - cron: "12 9 * * *"    # 14:12 PKT — afternoon
    - cron: "37 9 * * *"    # 14:37 PKT — afternoon catch-up
    - cron: "7 10 * * *"    # 15:07 PKT — afternoon catch-up

    - cron: "23 14 * * *"   # 19:23 PKT — evening
    - cron: "48 14 * * *"   # 19:48 PKT — evening catch-up
    - cron: "18 15 * * *"   # 20:18 PKT — evening catch-up
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate but do not commit (preview only)"
        type: boolean
        default: false
      force:
        description: "Publish even if a post already exists for today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the site
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate today's article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python .github/scripts/publish.py

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "Sarzif Policy Bot"
          git config user.email "sarzifpolicy@gmail.com"
          if git diff --quiet && git diff --staged --quiet; then
            echo "Nothing changed today. Skipping commit."
            exit 0
          fi
          git add _posts _data
          git commit -m "Publish article for $(date -u -d '+5 hours' +%Y-%m-%d)"
          git push
