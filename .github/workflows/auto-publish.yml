name: Daily article

on:
  schedule:
    # 06:00 Pakistan Standard Time = 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate but do not commit (preview only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python .github/scripts/publish.py

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "Sarzif Policy Bot"
          git config user.email "sarzifpolicy@gmail.com"
          if git diff --quiet && git diff --staged --quiet; then
            echo "Nothing changed today. Skipping commit."
            exit 0
          fi
          git add _posts _data
          git commit -m "Publish article for $(date -u -d '+5 hours' +%Y-%m-%d)"
          git push
